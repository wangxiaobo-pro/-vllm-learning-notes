  &lt;div class=&quot;intro&quot;&gt;
    &lt;h1&gt;Transformer 数据流探索器&lt;/h1&gt;
    &lt;div class=&quot;subtle&quot;&gt;用一个可以手算的 mini decoder-only 模型走一遍：&lt;span class=&quot;code-chip&quot;&gt;猫 追 老鼠 &amp;lt;eos&amp;gt;&lt;/span&gt; · B=&lt;span id=&quot;batch-intro&quot;&gt;2&lt;/span&gt; · T=4 · d=8 · h=2 · dₕ=4 · dff=16 · L=3 · V=8&lt;/div&gt;

        &lt;/tbody&gt;&lt;/table&gt;

        &lt;button class=&quot;node mlp&quot; type=&quot;button&quot; data-full-step=&quot;prob&quot;&gt;&lt;span class=&quot;name&quot;&gt;logits → 概率&lt;/span&gt;&lt;span class=&quot;shape&quot;&gt;softmax / 采样&lt;/span&gt;&lt;/button&gt;&lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
        &lt;button class=&quot;node io&quot; type=&quot;button&quot; data-full-step=&quot;next&quot;&gt;&lt;span class=&quot;name&quot;&gt;下一个 token&lt;/span&gt;&lt;span class=&quot;shape&quot;&gt;例如“&amp;lt;eos&amp;gt;”&lt;/span&gt;&lt;/button&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;llm-map&#x27;);
  if (!root) return;
  const tabs = [...root.querySelectorAll(&#x27;[data-tab]&#x27;)];

    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
